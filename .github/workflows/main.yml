name: APK Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: unzip -q ludoteca.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: ludoteca
        run: npm ci

      - name: Montar o app
        working-directory: ludoteca
        run: npm run android:sync

      - name: Compilar APK
        working-directory: ludoteca/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ludoteca-apk
          path: ludoteca/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ludoteca (build ${{ github.run_number }})
          files: ludoteca/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
